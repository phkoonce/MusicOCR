<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score review</title>
<style>
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: #f2f2f0; color: #222; }
  header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ccc; padding: 8px 16px; }
  header div { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.on { background: #ddd; }
  button:disabled { opacity: .45; cursor: default; }
  #map { margin-top: 6px; display: block; max-height: 30vh; overflow-y: auto; }
  #map .row { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 3px; }
  #map .name { width: 130px; font-size: 12px; color: #555; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .context { opacity: .55; }
  #map button { min-width: 30px; padding: 1px 4px; font-size: 12px; }
  #map .gap { width: 10px; }
  .s-done { background: #cfe9cf !important; } .s-check { background: #ffe2a8 !important; }
  .s-queued, .s-working { background: #cfdcff !important; } .s-failed, .s-changed { background: #f7c6c6 !important; }
  .current { outline: 2px solid #222; }
  main { max-width: 1400px; margin: 0 auto; padding: 12px 16px 60px; }
  .banner { background: #fff3cd; border: 1px solid #e0c36a; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }
  section { background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pill { font-size: 12px; font-weight: normal; border-radius: 10px; padding: 1px 8px; background: #eee; }
  .label { font-size: 11px; color: #777; margin: 6px 0 0; }
  .pic { position: relative; cursor: crosshair; }
  .pic img { display: block; width: 100%; }
  .pic img.top { position: absolute; left: 0; top: 0; mix-blend-mode: multiply; }
  .pin { position: absolute; width: 22px; height: 22px; margin: -11px; border: 2px solid #e65000; border-radius: 50%;
         box-sizing: border-box; color: #e65000; font: bold 11px/18px system-ui; text-align: center; pointer-events: none; }
  .tags input { font: inherit; width: min(520px, 70%); padding: 3px 6px; }
  .tags div { margin-top: 4px; display: flex; gap: 6px; align-items: center; }
  .notes { white-space: pre-wrap; background: #fafafa; border-left: 3px solid #ccc; padding: 6px 10px; margin: 8px 0 0; }
  .notes.bad { border-color: #c33; }
  .hint { color: #777; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <strong id="title"></strong><span id="progress" class="hint"></span>
    <button id="byLine">Line by line</button>
    <button id="byPage">Page re-check</button>
    <label class="hint" id="orderBox">order <select id="order"><option value="system">system by system</option>
      <option value="part">part by part</option></select></label>
    <label class="hint" id="contextBox"><input type="checkbox" id="context"> show other parts</label>
    <span id="nav"></span>
    <label class="hint">ours over original <input type="range" id="fade" min="0" max="100" value="100"></label>
  </div>
  <div id="map"></div>
</header>
<main id="main"></main>
<script>
"use strict";
let state = null, mode = "line", current = 0, page = 0, blink = false, seen = "", order = "system", context = false;
const drafts = {};                       // part-line -> tags not yet sent
const $ = s => document.querySelector(s);

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  e.append(...kids.filter(k => k !== null && k !== undefined));
  return e;
}
function button(text, onclick, cls = "", disabled = false) {
  return el("button", { textContent: text, onclick, className: cls, disabled });
}
const LABEL = { unchecked: "not checked", done: "done", queued: "waiting for Claude", working: "Claude is working",
                check: "re-check", failed: "failed", changed: "changed since checked" };
const tagsOf = unit => drafts[unit.i] ?? (drafts[unit.i] = unit.tags.map(t => ({ ...t })));
const busy = unit => unit.status === "queued" || unit.status === "working";
const todo = unit => unit.status === "unchecked" || unit.status === "changed";
const several = () => state.parts.length > 1;
// the order lines are worked through
const sequence = () => order === "part" ? [...state.units].sort((a, b) => a.s - b.s || a.line - b.line) : state.units;

async function load() {
  try {
    state = await (await fetch("/api/state")).json();
  } catch { $("#progress").textContent = "server stopped"; return; }
  const text = JSON.stringify(state);
  // never redraw under a note being typed
  if (text !== seen && document.activeElement?.type !== "text") { seen = text; render(); }
}
async function act(i, action, body = {}) {
  const r = await fetch(`/api/line/${i}/${action}`,
    { method: "POST", headers: { "X-Review": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const out = await r.json();
  if (!r.ok) { alert(out.error); return false; }
  delete drafts[i];
  state = out; seen = JSON.stringify(out);
  return true;
}
function next() {
  const list = sequence(), at = list.findIndex(u => u.i === current);
  for (let k = 1; k < list.length; k++) {
    const unit = list[(at + k) % list.length];
    if (todo(unit)) { current = unit.i; break; }
  }
}
async function done(i) { if (await act(i, "done")) { if (mode === "line") next(); render(); } }
async function send(i) {
  if (await act(i, "send", { tags: tagsOf(state.units[i]) })) { if (mode === "line") next(); render(); }
}
async function undo(i) { if (await act(i, "undo")) render(); }

// one staff of one line; without a unit it is only there for context
function picture(line, s, kind, unit) {
  const url = k => `/img/${line}/${s}/${k}.png?v=${state.rev}`;
  const box = el("div", { className: unit ? "pic" : "context" });
  if (kind === "overlay") {
    const top = el("img", { src: url("ours_blue"), className: "top fade" });
    top.style.opacity = $("#fade").value / 100;
    box.append(el("img", { src: url("orig_red"), alt: "original" }), top);
  } else {
    box.append(el("img", { src: url(kind), alt: kind }));
  }
  if (!unit) { box.style.width = "100%"; box.firstChild.style.width = "100%"; return box; }
  tagsOf(unit).forEach((t, n) => {
    const pin = el("span", { className: "pin", textContent: n + 1 });
    pin.style.left = t.x * 100 + "%"; pin.style.top = t.y * 100 + "%";
    box.append(pin);
  });
  box.onclick = e => {
    if (busy(unit)) return;
    const r = box.getBoundingClientRect();
    tagsOf(unit).push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, note: "" });
    render();
    const inputs = document.querySelectorAll(`#unit${unit.i} .tags input`);
    inputs[inputs.length - 1]?.focus();
  };
  return box;
}

function card(unit) {
  const tags = tagsOf(unit), waiting = busy(unit);
  const s = el("section", { id: "unit" + unit.i });
  const name = several() ? `${state.parts[unit.s]} · ` : "";
  s.append(el("h2", {}, `${name}line ${unit.line + 1} · bars ${unit.first}–${unit.last} · original page ${unit.page + 1}`,
    el("span", { className: "pill s-" + unit.status, textContent: LABEL[unit.status] })));
  if (unit.rests.length) s.append(el("div", { className: "hint", textContent:
    "multi-measure rests: " + unit.rests.map(r => `bars ${r[0]}–${r[1]} (${r[1] - r[0] + 1})`).join(", ") }));

  const others = on => context && several() && mode === "line"
    ? state.parts.map((p, k) => k).filter(on).map(k => picture(unit.line, k, "orig")) : [];
  s.append(el("div", { className: "label", textContent: blink ? "blink: ours" : "original" }),
           ...others(k => k < unit.s),
           picture(unit.line, unit.s, blink ? "ours" : "orig", unit),
           ...others(k => k > unit.s));
  if (mode === "line") s.append(el("div", { className: "label", textContent: "ours" }),
                                picture(unit.line, unit.s, "ours", unit));
  s.append(el("div", { className: "label", textContent: "overlay (red: original, blue: ours)" }),
           picture(unit.line, unit.s, "overlay", unit));

  const list = el("div", { className: "tags" });
  tags.forEach((t, n) => {
    const input = el("input", { type: "text", value: t.note, disabled: waiting,
      placeholder: "what is wrong? (may be left empty)" });
    input.oninput = () => { t.note = input.value; };
    input.onkeydown = e => { if (e.key === "Enter" || e.key === "Escape") input.blur(); };
    list.append(el("div", {}, el("b", { textContent: n + 1 }), input,
      button("remove", () => { tags.splice(n, 1); render(); }, "", waiting)));
  });
  s.append(list);

  const notes = [unit.summary, ...unit.unresolved.map(u => "not fixed / unsure: " + u)].filter(Boolean).join("\n");
  if (notes) s.append(el("div", { className: "notes", textContent: notes }));
  if (unit.error) s.append(el("div", { className: "notes bad", textContent: unit.error }));

  const row = el("div", {});
  row.style.cssText = "display:flex;gap:8px;margin-top:8px;flex-wrap:wrap";
  row.append(
    button(unit.status === "check" ? "Accept (D)" : "Looks right (D)", () => done(unit.i), "primary", waiting),
    button(tags.length ? `Send ${tags.length} mark(s) to Claude (S)` : "Have Claude find differences (S)",
           () => send(unit.i), "", waiting));
  if (unit.canUndo) row.append(button("Undo Claude's change", () => undo(unit.i), "", waiting));
  if (unit.status === "done") row.append(button("Mark unchecked", async () => { await act(unit.i, "reset"); render(); }));
  s.append(row);
  return s;
}

const go = unit => { current = unit.i; page = unit.page; render(); window.scrollTo(0, 0); };
// the lines of the shown page: of every part, or of the current one when working part by part
const onPage = () => sequence().filter(u => u.page === page && (order !== "part" || u.s === state.units[current].s));

function step(d) {
  if (mode === "line") {
    const list = sequence(), at = list.findIndex(u => u.i === current);
    go(list[Math.max(0, Math.min(list.length - 1, at + d))]);
  } else {
    const pages = [...new Set(state.units.map(u => u.page))];
    page = pages[Math.max(0, Math.min(pages.length - 1, pages.indexOf(page) + d))];
    render(); window.scrollTo(0, 0);
  }
}

function drawMap() {
  const map = $("#map"), scroll = map.scrollTop;
  map.replaceChildren();
  state.parts.forEach((name, s) => {
    const row = el("div", { className: "row" });
    if (several()) row.append(el("span", { className: "name", textContent: name, title: name }));
    state.units.filter(u => u.s === s).forEach((u, k, all) => {
      if (k && all[k - 1].page !== u.page) row.append(el("span", { className: "gap" }));
      const b = button(u.line + 1, () => go(u), "s-" + u.status);
      if (mode === "line" ? u.i === current : onPage().some(v => v.i === u.i)) b.className += " current";
      b.title = `bars ${u.first}–${u.last}: ${LABEL[u.status]}`;
      row.append(b);
    });
    map.append(row);
  });
  map.scrollTop = scroll;
}

function render() {
  if (!state) return;
  const units = state.units;
  if (!units.length) return;
  current = Math.min(current, units.length - 1);
  const pages = [...new Set(units.map(u => u.page))];
  if (!pages.includes(page)) page = pages[0];
  $("#title").textContent = state.title;
  document.title = "Review: " + state.title;
  const count = s => units.filter(u => u.status === s).length;
  $("#progress").textContent = `${count("done")}/${units.length} done · ${count("check")} to re-check · ` +
    `${count("queued") + count("working")} with Claude`;
  $("#byLine").className = mode === "line" ? "on" : "";
  $("#byPage").className = mode === "page" ? "on" : "";
  $("#orderBox").hidden = $("#contextBox").hidden = !several();
  $("#nav").replaceChildren(button("←", () => step(-1)), button("→", () => step(1)),
    el("span", { className: "hint", textContent: mode === "line" ? "" : ` page ${page + 1}` }));
  drawMap();

  const main = $("#main"), y = window.scrollY;
  main.replaceChildren();
  if (state.problem) main.append(el("div", { className: "banner", textContent:
    "The pictures could not be redrawn after the last change: " + state.problem }));
  if (state.claude) main.append(el("div", { className: "banner", textContent:
    `Sent lines are waiting: ${state.claude}. They are retried every minute.` }));
  if (units.some(busy)) main.append(el("div", { className: "banner",
    textContent: "Claude changes the score file while lines are with it. Keep this score closed in MuseScore until then." }));
  (mode === "line" ? [units[current]] : onPage()).forEach(u => main.append(card(u)));
  main.append(el("div", { className: "hint", textContent:
    "Click a picture to mark a spot. D: looks right · S: send to Claude · B: swap original and ours in place · ←/→: move" }));
  window.scrollTo(0, y);
}

$("#byLine").onclick = () => { mode = "line"; render(); };
$("#byPage").onclick = () => {
  mode = "page";
  const waiting = sequence().find(u => u.status === "check" || u.status === "failed") ?? state.units[current];
  current = waiting.i; page = waiting.page;
  render(); window.scrollTo(0, 0);
};
$("#order").onchange = e => { order = e.target.value; remember(); e.target.blur(); render(); };
$("#context").onchange = e => { context = e.target.checked; e.target.blur(); render(); };
$("#fade").oninput = e => document.querySelectorAll(".fade").forEach(i => { i.style.opacity = e.target.value / 100; });
function remember() { try { localStorage.setItem("order", order); } catch { /* private window */ } }
try { order = localStorage.getItem("order") || order; } catch { /* private window */ }
$("#order").value = order;
document.addEventListener("keydown", e => {
  if (!state || e.metaKey || e.ctrlKey || e.altKey || e.target.type === "text") return;
  const k = e.key.toLowerCase();
  if (k === "b") { blink = !blink; render(); }
  else if (k === "arrowleft") { e.preventDefault(); step(-1); }
  else if (k === "arrowright") { e.preventDefault(); step(1); }
  else if (mode === "line" && (k === "d" || k === "s")) {
    const unit = state.units[current];
    if (!busy(unit)) (k === "d" ? done : send)(unit.i);
  }
});
load().then(() => {
  const first = state && sequence().find(todo);
  if (first) { current = first.i; page = first.page; render(); }
});
setInterval(load, 3000);
</script>
</body>
</html>
