# German Hornsound "the books" Vol. 2 Opera -- four horn books, the pieces' table of contents is scanned (pages 2-3), pieces
# share pages, bar numbers are printed. Horn books use the old bass clef (octave-low), fixed by old_bass_clef.
name = "ghs-opera"
title = "the books Vol. 2 Opera - Horns 1-4"
key_prefix = "GO_"
instrument = "horn in f"
part_name = "Horn"
part_id_prefix = "h"
bar_numbers = true
toc_pages = "2-3"
first_page = 4
input_dir = "input/ghs-opera"

[[books]]
