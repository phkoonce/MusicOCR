# "Grüne Bücher" -- Quartette für Waldhorn, 1. Folge (Liebert): four horn books, 88 short pieces that
# share pages. Spec for `musicocr collection` (format: musicocr/collection/spec.py).
#
#   .venv/bin/python -m musicocr collection split   workflows/gb/collection.toml
#   .venv/bin/python -m musicocr collection batch   workflows/gb/collection.toml
#   .venv/bin/python scripts/batch_run.py --batch batches/gb-all.toml
#   .venv/bin/python -m musicocr collection combine workflows/gb/collection.toml
name = "gb-all"
title = "Quartette für Waldhorn, 1. Folge (Liebert) - Horns 1-4"
key_prefix = "GB_"
instrument = "horn in f"
part_name = "Horn"
part_id_prefix = "h"
bar_numbers = false
toc_pages = "5-11"
first_page = 12
input_dir = "input/gb"

[[books]]
id = "1"
pdf = "~/Library/CloudStorage/GoogleDrive-philip.koonce@gmail.com/My Drive/GB/GB H1 - unlocked.pdf"
[[books]]
id = "2"
pdf = "~/Library/CloudStorage/GoogleDrive-philip.koonce@gmail.com/My Drive/GB/GB H2 - unlocked.pdf"
[[books]]
id = "3"
pdf = "~/Library/CloudStorage/GoogleDrive-philip.koonce@gmail.com/My Drive/GB/GB H3 - unlocked.pdf"
[[books]]
id = "4"
pdf = "~/Library/CloudStorage/GoogleDrive-philip.koonce@gmail.com/My Drive/GB/GB H4 - unlocked.pdf"
old_bass_clef = true      # Horn 4 is in the old notation (bass clefs an octave low), see scoreops/retouch.py

# Table-of-contents lines the OCR got wrong or merged (checked against the printed Inhalt)
