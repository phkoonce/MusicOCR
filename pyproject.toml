[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musicocr"
version = "0.1.0"
description = "PDF to MusicXML/MuseScore OMR pipeline"
requires-python = ">=3.9"
dependencies = [
    # music21 9.x requires Python >= 3.10; system Python here is 3.9.
    "music21>=8,<9",
    # Python 3.9 has no stdlib tomllib.
    "tomli>=2 ; python_version < '3.11'",
    # Scan pre-processing (musicocr/preprocess.py): rasterise, deskew, crop, sharpen.
    "Pillow>=9",
    "numpy>=1.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
musicocr = "musicocr.cli:main"

[tool.setuptools]
packages = ["musicocr", "musicocr.stages"]
