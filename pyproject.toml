[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musicocr"
version = "0.1.0"
description = "PDF to MusicXML/MuseScore OMR pipeline"
requires-python = ">=3.11"
dependencies = [
    # Kept at 8.x (tested green on Python 3.13); 9.x is allowed by Python but not adopted.
    "music21>=8,<9",
    # Scan pre-processing (musicocr/preprocess.py): rasterise, deskew, crop, sharpen.
    "Pillow>=9",
    "numpy>=1.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
musicocr = "musicocr.cli:main"

[tool.setuptools]
packages.find = { include = ["musicocr*"] }

[tool.setuptools.package-data]
"musicocr.text" = ["vision_ocr.swift", "lexicon.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["omr-eval/*/repo", "omr-eval/*/.venv", "omr-eval/oemer", "output", "input", "experiments"]

[tool.ruff.lint]
# F: pyflakes (unused imports/variables, undefined names); E: pycodestyle errors; B: likely bugs;
# BLE: blind `except Exception` must be justified with a noqa; SIM: needless complexity.
select = ["E", "F", "B", "BLE", "SIM"]
ignore = ["E501", "E731", "SIM108", "SIM105", "B905", "B007"]   # long lines, lambdas, ternary style, zip(strict=) and unused loop vars are taste calls

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "BLE001"]
"scripts/*" = ["E402"]       # they extend sys.path before importing musicocr
"omr-eval/*.py" = ["E402", "B904"]
