[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musicocr"
version = "0.1.0"
description = "PDF to MusicXML/MuseScore OMR pipeline"
requires-python = ">=3.11"
dependencies = [
    # Kept at 8.x (tested green on Python 3.13); 9.x is allowed by Python but not adopted.
    "music21>=8,<9",
    # Scan pre-processing (musicocr/preprocess.py): rasterise, deskew, crop, sharpen.
    "Pillow>=9",
    "numpy>=1.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
musicocr = "musicocr.cli:main"

[tool.setuptools]
packages = ["musicocr", "musicocr.stages", "musicocr.alignment"]

[tool.setuptools.package-data]
musicocr = ["vision_ocr.swift", "text_lexicon.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
