# MusicOCR configuration.
# Paths below are the verified locations on this machine; edit if you move the apps.

[tools]
audiveris = "/Applications/Audiveris.app/Contents/MacOS/Audiveris"
# homr's own isolated venv (Python 3.12 + ONNX runtime, separate from this
# project's venv) — see omr-eval/README.md for setup. Defaults to
# <repo>/omr-eval/homr/.venv/bin/python; override if you installed it
# elsewhere. Invoked by calling homr.main:main directly rather than the
# installed console-script, so a moved venv's stale shebang doesn't matter.
# homr_python = "/path/to/omr-eval/homr/.venv/bin/python"
# Copisteria's own venv (Python 3.12) and repo clone, from omr-eval/setup.sh.
# Defaults to <repo>/omr-eval/copisteria/.venv/bin/python.
# copisteria_python = "/path/to/omr-eval/copisteria/.venv/bin/python"
musescore = "/Applications/MuseScore 4.app/Contents/MacOS/mscore"
# poppler utilities (installed via `brew install poppler`)
pdfinfo = "pdfinfo"
pdftoppm = "pdftoppm"
pdftotext = "pdftotext"

[omr]
# Which engine transcribes pages:
#   "homr"      - end-to-end OMR model (omr-eval/README.md). No whole-book
#                 mode, no [omr.profiles.*] tuning, no GUI correction. Needs
#                 rasterised page images, so it always rasterises pages
#                 regardless of [preprocess] enabled.
#   "copisteria" - page-image reader with a learned evidence model (omr-eval/setup.sh).
#                 Benchmarked by its authors on multi-staff scores, not yet on parts here.
#   "legato2"   - placeholder; the model is not released (paper only).
#   "audiveris" - classical segment-classify-reconstruct pipeline, tunable via
#                 [omr.profiles.*] constants, the only engine with a GUI
#                 hand-correction round-trip ([stages.correct]).
# homr consistently outperformed Audiveris on monophonic wind/brass parts in
# local testing; Audiveris remains available for full scores / hand-correction.
engine = "homr"
# Which profile under [omr.profiles.*] to use unless --profile overrides it
# (Audiveris only).
profile = "default"
# Per-page ceiling on the OMR engine (each page runs in its own process).
page_timeout_seconds = 900
# Overall ceiling when Audiveris is run on the whole book in one go (only used
# when the page count can't be determined; homr always runs per-page).
timeout_seconds = 1800
# Transcribe each page in a separate process. Strongly recommended for
# Audiveris: a single un-transcribable page otherwise aborts the whole book
# with no output. homr always runs per-page regardless of this setting.
per_page = true
# After per-page OMR, stitch the pages into one <book>.musicxml (music21). Right
# for a single continuous part; turn off for a mixed song-book to keep pages
# separate. Pages are always kept individually regardless.
merge_pages = true

[omr.homr]
# Patch homr's known generator bug where a correctly-recognised multi-measure
# rest is exported with a <multiple-rest> tag but no note/rest content at all
# (liebharc/homr#140, open upstream as of 2026-09). Runs on each page's raw
# export right after homr writes it, before merge/validate see it. See
# musicocr/homr_fixes.py and omr-eval/README.md's 2026-09-12 finding.
fix_multirest = true

[omr.copisteria]
# Symbol detector: "28m" (default, more accurate) or "2m" (smaller, faster).
detector = "28m"
# Page text handed to Copisteria as <page>.texts.json so multi-measure rests keep
# their counts (without it they come out as plain bars). "pdf-layer" reads digit
# boxes from the PDF's text layer (born-digital PDFs only); "ocr" runs OCR on the
# prepped page image (works on scans; see ocr_backend); "auto" = pdf-layer when the page has a text layer, else ocr;
# "none" skips.
texts = "pdf-layer"
# OCR engine for texts = "ocr"/"auto" (musicocr/ocr_backends.py): "rapidocr" (PP-OCR via
# the homr venv, offline), "vision" (macOS Vision via a Swift helper compiled on first
# use) or "auto" = union of both (they miss different isolated numerals).
ocr_backend = "auto"
# Copisteria writes a bar it found no content for as a bare <forward>; give it a
# whole-measure rest (musicocr/copisteria_fixes.py), like homr's fix_multirest.
fix_empty = true
# Drop a misread "bar" made of a cautionary key/time signature after a double bar
# (key-change bar with a spurious note, whose time change sits in the next bar).
# Logged; musicocr/copisteria_fixes.py. validate's bar-count check reports the rest.
fix_ghost_bars = true
# When a page's first reading leaves gaps (symbols the detector missed), re-detect it
# at second_pass_scale x the input size, add the extra notes/rests found, re-read, and
# keep the result only if it changed nothing but the gap bars (otherwise the first
# reading stays). Costs one extra run for pages that have gaps.
second_pass = true
second_pass_scale = 1.28
# Page 1 only: Copisteria pads a pickup (upbeat) bar to a full bar with a hidden
# rest when it misses the printed opening meter; drop the padding and show the meter.
fix_pickup = true
# Gaps where Copisteria read nothing (usually a dropped symbol) come out as hidden
# rests in MuseScore; make them visible, orange-coloured rests so they are easy to find.
reveal_gaps = true
# Multi-measure-rest form of the output: "collapse" (default) folds a tagged rest
# plus its N-1 following rest bars into one bar like homr writes (what the
# align_* tools expect; bar numbers then drift from print), "expand" writes the
# standard N-bar form from collapsed input, "keep" leaves Copisteria's output
# untouched. See musicocr/multirest.py.
multirest_form = "collapse"
# Clone Copisteria runs from (it looks for models/ relative to its repo root).
# repo = "/path/to/omr-eval/copisteria/repo"

# Audiveris application "constants" (see `Audiveris -help`). Real tuning is
# iterative: run once, inspect report.md + qa images, then add constants here.
[omr.profiles.default]
constants = []

[omr.profiles.dense-orchestral]
# Placeholder preset for busy full scores. Populate with constants once tuned.
constants = []

[omr.profiles.clean-typeset]
# Placeholder preset for crisp born-digital PDFs.
constants = []

[preprocess]
# Rasterise each PDF page and clean it up before OMR. Meant for low-resolution /
# grey / camera scans (check `pdfimages -list your.pdf` — under ~200 ppi means
# leave this on). Pass --no-preprocess for a crisp born-digital PDF, where
# rasterising only adds noise. Tune with scripts/experiment.py.
enabled = true
dpi = 350
autocontrast = true
autocontrast_cutoff = 1
unsharp = true
unsharp_radius = 2.0
unsharp_percent = 150
median = 0            # 0 = off; 3 = light denoise before sharpening
# Camera / phone scans: rotate each page so the staves are level (Audiveris only
# tolerates a degree or so of skew), and trim the stray header/footer text lines
# (running "… - 3rd Trombone" line, page number, copyright, logos) that OMR turns
# into junk text symbols. Both skip themselves when there's nothing to fix, and
# the crop is conservative — it won't touch a first page's centred title block.
# Toggle per-run with --deskew/--crop and --no-deskew/--no-crop.
deskew = true
max_skew = 5.0        # only correct rotation within +/- this many degrees
crop_margins = true
crop_pad_frac = 0.035  # whitespace to leave above/below the outer staves

[stages.correct]
# When true, the pipeline stops after OMR so you can open the saved .omr project
# in the Audiveris GUI, correct it, and re-run from `extract`. Off for v1.
enabled = false

[stages.normalize]
# After extract, force every measure whose notes don't sum to its time
# signature (the dominant homr rhythm-misread pattern -- see
# omr-eval/README.md) to match it exactly: truncate overlong measures at the
# barline, pad underlong ones with a rest. Lossy (the actually-wrong note
# can't be identified without the scan) but keeps MuseScore's barlines
# aligned across parts, which matters a lot for hand-correction. Mechanical
# and engine-agnostic -- only measures already disagreeing with their time
# signature are touched -- so it's safe to leave on for Audiveris output too.
enabled = true

[stages.transpose]
# Optional, off by default. `mode = "written"` (default) leaves the notes as
# printed and sets the part's instrument name + <transpose>, so MuseScore shows
# the written score and its concert-pitch toggle does the shift. `mode =
# "concert"` instead rewrites pitches and keys at concert pitch. Give `semitones` (all parts) or
# `instrument` (looked up in musicocr/instruments.py); with neither, each part
# is identified by its <part-name>. `clef` ("treble"/"bass"/"c") overrides the
# first-clef detection for clef-dependent instruments (baritone, tuba...).
# CLI: --transpose / --no-transpose / --transpose-instrument / --transpose-semitones.
enabled = false
# mode = "written"
# instrument = "horn in f"
# semitones = -7
# clef = "treble"

[output]
# Any subset of: "musicxml", "mscz", "midi", "qa-pdf"
formats = ["musicxml", "mscz", "midi", "qa-pdf"]
# DPI for the side-by-side QA page renders.
qa_dpi = 150
