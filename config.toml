# MusicOCR configuration.
# Paths below are the verified locations on this machine; edit if you move the apps.

[tools]
audiveris = "/Applications/Audiveris.app/Contents/MacOS/Audiveris"
musescore = "/Applications/MuseScore 4.app/Contents/MacOS/mscore"
# poppler utilities (installed via `brew install poppler`)
pdfinfo = "pdfinfo"
pdftoppm = "pdftoppm"

[omr]
# Which profile under [omr.profiles.*] to use unless --profile overrides it.
profile = "default"
# Per-page ceiling on Audiveris (each page is transcribed in its own process).
page_timeout_seconds = 900
# Overall ceiling when Audiveris is run on the whole book in one go (only used
# when the page count can't be determined).
timeout_seconds = 1800
# Transcribe each page in a separate Audiveris process. Strongly recommended: a
# single un-transcribable page otherwise aborts the whole book with no output.
per_page = true
# After per-page OMR, stitch the pages into one <book>.musicxml (music21). Right
# for a single continuous part; turn off for a mixed song-book to keep pages
# separate. Pages are always kept individually regardless.
merge_pages = true

# Audiveris application "constants" (see `Audiveris -help`). Real tuning is
# iterative: run once, inspect report.md + qa images, then add constants here.
[omr.profiles.default]
constants = []

[omr.profiles.dense-orchestral]
# Placeholder preset for busy full scores. Populate with constants once tuned.
constants = []

[omr.profiles.clean-typeset]
# Placeholder preset for crisp born-digital PDFs.
constants = []

[stages.correct]
# When true, the pipeline stops after OMR so you can open the saved .omr project
# in the Audiveris GUI, correct it, and re-run from `extract`. Off for v1.
enabled = false

[output]
# Any subset of: "musicxml", "mscz", "midi", "qa-pdf"
formats = ["musicxml", "mscz", "midi", "qa-pdf"]
# DPI for the side-by-side QA page renders.
qa_dpi = 150
